version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    expose:
      - "8080"

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    environment:
      INGEST_URL: ${INGEST_URL}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL}
      INGEST_TOKEN: ${INGEST_TOKEN}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-43200}
      HEALTHCHECK_INTERVAL_SECONDS: ${HEALTHCHECK_INTERVAL_SECONDS:-300}

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vectortrace
      POSTGRES_USER: vectortrace
      POSTGRES_PASSWORD: vectortrace
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:

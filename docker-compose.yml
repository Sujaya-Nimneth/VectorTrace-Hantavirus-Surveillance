services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    expose:
      - "8080"

  # Opt-in Docker scheduler. pg_cron (see supabase migrations) is the default
  # scheduler — enabling both duplicates ingest runs and metric rows.
  # Start with: docker compose --profile scheduler up
  scraper:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: Dockerfile.scraper
    environment:
      INGEST_URL: ${INGEST_URL}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL}
      INGEST_TOKEN: ${INGEST_TOKEN}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-43200}
      HEALTHCHECK_INTERVAL_SECONDS: ${HEALTHCHECK_INTERVAL_SECONDS:-300}

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/default.conf:/etc/nginx/conf.d/default.conf:ro

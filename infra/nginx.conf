events {}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # WebSocket/keep-alive upgrade handling: only send "Connection: upgrade"
  # when the client actually requested an upgrade.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
